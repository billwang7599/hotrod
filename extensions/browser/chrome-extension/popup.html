<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Kothar</title>
    <style>
      body { font: 13px system-ui, sans-serif; width: 300px; margin: 12px; color: #1f2328; }
      h1 { font-size: 14px; margin: 0 0 8px; }
      p { margin: 6px 0; color: #59636e; }
      input { box-sizing: border-box; width: 100%; padding: 6px; font: 12px ui-monospace, monospace; }
      button { margin-top: 8px; padding: 5px 10px; }
      #status.connected { color: #1a7f37; }
      #status.offline, #status.error { color: #cf222e; }
      @media (prefers-color-scheme: dark) { body { background: #1f2328; color: #e6edf3; } p { color: #9198a1; } }
    </style>
  </head>
  <body>
    <h1>Kothar</h1>
    <p id="status">…</p>
    <form id="pair">
      <p>Paste the pairing code from Kothar: Settings → Extensions → Browser.</p>
      <input id="code" placeholder="KOTHAR:…" autocomplete="off" spellcheck="false" />
      <button type="submit">Pair</button>
    </form>
    <button id="unpair" hidden>Unpair</button>
    <p>Agents work only in tabs in a blue “Kothar · space” group. Drag a tab out of the group to take it back.</p>
    <script type="module" src="popup.js"></script>
  </body>
</html>
