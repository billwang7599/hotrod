    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#tile)" filter="url(#shadow)"/>
  <rect x="101" y="101" width="822" height="822" rx="184" fill="none" stroke="#fff" stroke-opacity="0.08" stroke-width="2"/>
  <g transform="translate(-2 88)">
    <path d="M232 372C262 360 284 356 314 356L796 356L796 434L700 468C664 496 648 540 648 580L648 600C690 610 724 632 742 668L742 700L358 700L358 668C376 632 410 610 452 600L452 580C452 540 436 500 404 482C336 468 272 430 232 372Z" fill="url(#steel)"/>
    <rect x="200" y="356" width="620" height="14" fill="#fff" fill-opacity="0.35" clip-path="url(#anvil)"/>
    <path d="M612 144L630 212L698 230L630 248L612 316L594 248L526 230L594 212Z" fill="#dfe9fd"/>
  </g>
</svg>
