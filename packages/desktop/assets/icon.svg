<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Kothar: an anvil in temper blue, with the spark of a hammer blow. The mark's paths also live in
       packages/ui/src/logo.svg, packages/ui/src/mark.tsx and packages/ui/public/favicon.svg. -->
